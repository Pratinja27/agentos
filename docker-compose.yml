services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentos
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://agentos:agentos@db:5432/agentos
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHROMA_DIR: /data/chroma
      CHROMA_ENABLED: "false"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - chroma:/data/chroma
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  chroma:
